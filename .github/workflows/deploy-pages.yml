# Temporary hosting on GitHub Pages while the repo is public (app uses Neon branch "development").
# Deploys only from main. Move to Cloudflare Pages when the repo goes private (see docs/roadmap.md).
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Public client endpoints of Neon branch "development" (every browser sees them; not secrets).
      # Kept here because the repo's .gitignore blocks all .env.* files on purpose.
      VITE_NEON_AUTH_URL: https://ep-green-surf-b3aqwu8p.neonauth.c-4.ap-southeast-1.aws.neon.tech/neondb/auth
      VITE_NEON_DATA_API_URL: https://ep-green-surf-b3aqwu8p.apirest.c-4.ap-southeast-1.aws.neon.tech/neondb/rest/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build:pages
      - name: Check the build is configured (never publish a site without its backend URLs)
        run: grep -qF "$VITE_NEON_AUTH_URL" dist/assets/*.js && grep -qF "$VITE_NEON_DATA_API_URL" dist/assets/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
